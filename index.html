<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bienvenidos a casa</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="lang-bar">
  <div class="lang-switcher" id="lang-switcher"></div>
</div>

<main class="wrap home">
  <div class="floor-plan-carousel" id="floor-plan-carousel">
    <div class="carousel-viewport">
      <div class="carousel-track">
        <img src="assets/images/plano-casa.png" alt="Plano de la casa">
        <img src="assets/images/plano-garaje.png" alt="Plano del garaje">
      </div>
    </div>
    <div class="carousel-dots">
      <button type="button" class="carousel-dot is-active" data-index="0" aria-label="Plano de la casa"></button>
      <button type="button" class="carousel-dot" data-index="1" aria-label="Plano del garaje"></button>
    </div>
  </div>

  <div class="hero-text">
    <h1 id="site-title">Bienvenidos a casa</h1>
    <p class="tagline" id="site-tagline">Tu intercambio de casa en Zarautz</p>
  </div>

  <div id="categories"></div>

  <footer class="site-footer" id="site-footer"></footer>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/floor-plan-carousel.js"></script>
<script src="assets/js/render-home.js"></script>
</body>
</html>
