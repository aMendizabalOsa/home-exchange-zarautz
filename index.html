<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bienvenidos a casa</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="lang-switcher" id="lang-switcher"></div>

<div class="top-bar">
  <div class="top-bar-inner">
    <span>🏡</span>
    <nav>
      <a href="map.html" data-nav-map>Mapa</a>
      <a href="print.html" data-nav-print>Imprimir / PDF</a>
    </nav>
  </div>
</div>

<main class="wrap">
  <section class="floor-plan">
    <h2 id="floor-plan-title">Plano de la casa</h2>

    <p class="floor-plan-caption" id="floor-plan-caption"></p>

  <div class="search-box">
    <input type="search" id="search-input" placeholder="Buscar una sección...">
  </div>
  <p class="no-results" id="no-results" hidden>No se ha encontrado ninguna sección con ese texto.</p>

  <div id="categories"></div>

  <footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/lightbox.js"></script>
<script src="assets/js/render-home.js"></script>

</html>
